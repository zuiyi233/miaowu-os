services:
  nginx:
    image: nginx:alpine
    container_name: miaowu-os-nginx
    ports:
      - "${PORT:-4560}:4560"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - miaowu-os
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: miaowu-os-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me-in-production}
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8551
    env_file:
      - .env.docker
    networks:
      - miaowu-os
    restart: unless-stopped

  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: miaowu-os-gateway
    command: sh -c "cd backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8551 --workers ${GATEWAY_WORKERS:-4}"
    volumes:
      - ./config.docker.yaml:/app/backend/config.yaml:ro
      - ./extensions_config.docker.json:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - miaowu-os-data:/app/backend/.deer-flow
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://gateway:8551/api
      - DEER_FLOW_CHANNELS_GATEWAY_URL=http://gateway:8551
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - MIAOWU_FFMPEG_BIN=${MIAOWU_FFMPEG_BIN:-/usr/bin/ffmpeg}
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - miaowu-os
    restart: unless-stopped

volumes:
  miaowu-os-data:

networks:
  miaowu-os:
    driver: bridge
